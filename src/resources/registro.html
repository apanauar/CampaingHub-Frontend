<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Hub - Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Página Registro: ruta "/registro" -->
    <div class="auth-page">
        <div class="auth-container">
            <a href="index.html" class="app-logo"><i class="fas fa-bullhorn"></i><span>Campaign Hub</span></a>

            <div class="card">
                <h1>Crear cuenta</h1>
                <p class="texto-suave">Empezás en el plan Plus: hasta 4 campañas gratis.</p>

                <!-- Error que devuelve la API, ej: email ya registrado -->
                <div class="alerta alerta-error"><i class="fas fa-circle-exclamation"></i> El usuario ya existe</div>

                <form>
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" placeholder="Tu nombre">
                        <span class="error"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="input-error" value="rodrigo@">
                        <span class="error">El email debe ser válido</span>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="Mínimo 8 caracteres">
                        <span class="error"></span>
                    </div>

                    <div class="form-group">
                        <label for="repetirPassword">Repetir contraseña</label>
                        <input type="password" id="repetirPassword" class="input-error" value="12345">
                        <span class="error">Las contraseñas no coinciden</span>
                    </div>

                    <!-- Deshabilitado mientras algún dato sea inválido -->
                    <button type="submit" class="btn btn-block" disabled>Registrarme</button>
                </form>
            </div>

            <p class="auth-link">¿Ya tenés cuenta? <a href="index.html">Ingresá</a></p>
        </div>
    </div>
</body>

</html>
